name: Anthropic OSS Image Batch

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/anthropic-oss-image-batch.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scene: "01"
            prompt: "Cinematic macro view of a vast open-source code repository being scanned by a luminous AI security beam, dark black background, cyan and red cyber accents, premium editorial technology photography, intricate code-like abstract structures without readable text, single focal subject, vertical 9:16"
          - scene: "02"
            prompt: "Open-source software network visualized as connected glowing code modules entering an AI cybersecurity scanner, elegant dark future-tech studio, cyan light, subtle red threat markers, clean professional composition, no readable text, vertical 9:16"
          - scene: "03"
            prompt: "Autonomous AI security pipeline continuously scanning software packages in a loop, layered server nodes, shield symbols and scanning arcs, sophisticated dark cinematic cyber aesthetic, no people, no readable text, vertical 9:16"
          - scene: "04"
            prompt: "Massive field of software vulnerability nodes emerging from source code, thousands of tiny red warning lights surrounding a central AI scanner, dramatic scale, premium cybersecurity visualization, dark background, no text, vertical 9:16"
          - scene: "05"
            prompt: "Huge stream of glowing vulnerability reports funneling through one narrow verification gate, visual metaphor for a human review bottleneck, dark premium tech aesthetic, cyan data flow and red alerts, no people, no readable text, vertical 9:16"
          - scene: "06"
            prompt: "Cybersecurity laboratory visualization of many isolated software project containers being tested against high-severity vulnerability findings, clean geometric modules, dark cinematic lighting, red and cyan accents, no readable text, vertical 9:16"
          - scene: "07"
            prompt: "Rows of vulnerability signals passing through a rigorous security validation gate, most emerging as bright verified shield symbols while a few are rejected, dark premium cybersecurity scene, no readable text, vertical 9:16"
          - scene: "08"
            prompt: "Autonomous AI system sending vulnerability report packets directly from a scanning engine toward software maintainer inbox-like endpoints, no human intermediary, tense dark cyber aesthetic, clean abstract interface shapes without readable text, vertical 9:16"
          - scene: "09"
            prompt: "Ambiguous cybersecurity alert cards splitting between genuine vulnerability symbols and uncertain false alarms, visual metaphor for AI uncertainty, dramatic dark studio lighting, red amber and cyan accents, no readable text, vertical 9:16"
          - scene: "10"
            prompt: "Close-up abstract software security workflow showing vulnerable code block, reproducible exploit path and corrected code patch as three connected visual modules, high-end cyber editorial illustration, no readable text, vertical 9:16"
          - scene: "11"
            prompt: "Global digital infrastructure built from interconnected open-source software blocks powering cloud servers networks and critical systems, cinematic dark world-scale technology scene, cyan data lines, no readable text, vertical 9:16"
          - scene: "12"
            prompt: "Powerful AI core inspecting a vast wall of software code and transforming red vulnerability signals into secure cyan shields, cinematic future-tech ending frame, dramatic premium lighting, strong single focal point, no readable text, vertical 9:16"
    steps:
      - uses: actions/checkout@v4
      - name: Generate one scene image
        env:
          SCENE: ${{ matrix.scene }}
          PROMPT: ${{ matrix.prompt }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse, urllib.request, pathlib, hashlib
          scene=os.environ['SCENE']
          prompt=os.environ['PROMPT'] + '. Clean single-frame composition, no visible text, no watermark, no logo, no collage, no storyboard.'
          seed=int(hashlib.sha256((scene+'|'+prompt).encode()).hexdigest()[:8],16)%1000000
          url='https://image.pollinations.ai/prompt/'+urllib.parse.quote(prompt,safe='')+f'?width=1080&height=1920&nologo=true&model=flux&seed={seed}'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 GitHubActions'})
          out=pathlib.Path(f'scene_{scene}.jpg')
          with urllib.request.urlopen(req,timeout=180) as r:
              raw=r.read(); ctype=r.headers.get('Content-Type','')
          if len(raw)<20000 or 'image' not in ctype.lower():
              raise SystemExit(f'invalid response bytes={len(raw)} type={ctype}')
          out.write_bytes(raw)
          print(f'generated {out} bytes={len(raw)} seed={seed}')
          PY
          file "scene_${SCENE}.jpg"
      - name: Upload scene artifact
        uses: actions/upload-artifact@v4
        with:
          name: scene-${{ matrix.scene }}
          path: scene_${{ matrix.scene }}.jpg
          retention-days: 1

  collect:
    runs-on: ubuntu-latest
    needs: generate
    if: always()
    steps:
      - uses: actions/checkout@v4
      - name: Download successful scene artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: scene-*
          path: batch
          merge-multiple: true
      - name: Verify complete batch
        run: |
          count=$(find batch -maxdepth 1 -type f -name 'scene_*.jpg' | wc -l)
          echo "scene_count=$count"
          test "$count" -eq 12
      - name: Commit generated images
        run: |
          target="generated/anthropic-oss-scanner-20261011-v1/assets"
          mkdir -p "$target"
          cp batch/scene_*.jpg "$target/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$target"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Generate Anthropic OSS Scanner scene assets"
            git push
          fi
